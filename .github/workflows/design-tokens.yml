name: "Design tokens sync"
run-name: "Design tokens sync"

on:
  pull_request_target:
    branches: [main]

jobs:
  process-fork:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - uses: ./.github/actions/custom-preparing-action

      - name: Setup Git bot user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch
        run: |
          DATE=$(date +'%Y-%m-%d')
          BRANCH_NAME="design/tokens-${DATE}-${{ github.run_id }}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b "$BRANCH_NAME"

      - name: Fetch only tokens.json from fork
        env:
          FORK_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git
          FORK_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Забираем только tokens.json из форка
          git fetch "$FORK_URL" "$FORK_BRANCH:fetch/$FORK_BRANCH"

          # Checkout только tokens.json из ветки форка
          git checkout "fetch/$FORK_BRANCH" -- tokens.json

      - name: Check for tokens.json
        id: check-tokens
        run: |
          if [ -f "tokens.json" ]; then
            echo "✅ tokens.json found"
            echo "has_tokens=true" >> $GITHUB_OUTPUT
          else
            echo "❌ tokens.json not found"
            echo "has_tokens=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate CSS variables
        if: steps.check-tokens.outputs.has_tokens == 'true'
        id: generate-css
        run: |
          pnpm build:tokens

          # Проверяем изменилось ли что-то
          if git diff --quiet; then
            echo "✅ No CSS changes needed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git add .
            git commit -m "🎨 Auto-generated CSS variables"
            echo "✅ CSS changes committed"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Stylelint
        if: steps.generate-css.outputs.has_changes == 'true'
        run: |
          pnpm stylelint:fix

      - name: Push to main repo
        if: steps.generate-css.outputs.has_changes == 'true'
        run: |
          # Пушим ветку в основной репозиторий
          git push origin ${{env.BRANCH_NAME}}

      - name: Create PR
        if: steps.generate-css.outputs.has_changes == 'true'
        run: |
          # Создаем новый PR в основном репо
          gh pr create \
            --title "🎨 Design sync: $PR_TITLE" \
            --body "Auto-synced from fork PR #$PR_NUMBER" \
            --base main \
            --head ${{env.BRANCH_NAME}} \

          # Закрываем старый PR из форка
          gh pr close "$PR_NUMBER" \
            --comment "✅ Auto-synced to new PR in main repository"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
